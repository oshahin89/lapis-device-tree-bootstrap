name: lapis-audio-probe
on:
  workflow_dispatch:
  push:
    paths:
      - tools/lapis_audio_probe/**
      - tools/lapis_audio_hal/**
      - .github/workflows/lapis-audio-probe.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS PCM ingress probe
        run: |
          set -euxo pipefail
          mkdir -p out
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O2 -Wall -Wextra -o out/lapis_audio_probe tools/lapis_audio_probe/main.c
          strip -x out/lapis_audio_probe
          codesign -s - -f out/lapis_audio_probe
          test "$(stat -f %z out/lapis_audio_probe)" -le 147456
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O2 -Wall -Wextra -o out/lapis_hal_check tools/lapis_audio_probe/hal_check.c
          strip -x out/lapis_hal_check
          codesign -s - -f out/lapis_hal_check
          test "$(stat -f %z out/lapis_hal_check)" -le 147456
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O2 -Wall -Wextra -framework CoreFoundation -o out/lapis_hal_driver_check tools/lapis_audio_probe/hal_driver_check.c
          strip -x out/lapis_hal_driver_check
          codesign -s - -f out/lapis_hal_driver_check
          test "$(stat -f %z out/lapis_hal_driver_check)" -le 147456
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O2 -Wall -Wextra -framework CoreFoundation -o out/lapis_hal_sound_check tools/lapis_audio_probe/hal_sound_check.c
          strip -x out/lapis_hal_sound_check
          codesign -s - -f out/lapis_hal_sound_check
          test "$(stat -f %z out/lapis_hal_sound_check)" -le 147456
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O2 -Wall -Wextra -framework CoreFoundation -o out/lapis_hal_cycle_check tools/lapis_audio_probe/hal_cycle_check.c
          strip -x out/lapis_hal_cycle_check
          codesign -s - -f out/lapis_hal_cycle_check
          test "$(stat -f %z out/lapis_hal_cycle_check)" -le 147456
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O2 -Wall -Wextra -o out/lapis_hal_fs_check tools/lapis_audio_probe/hal_fs_check.c
          strip -x out/lapis_hal_fs_check
          codesign -s - -f out/lapis_hal_fs_check
          test "$(stat -f %z out/lapis_hal_fs_check)" -le 147456
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O2 -Wall -bundle -DLAPIS_HAL_DISCOVERY_PROBE -framework CoreFoundation -o out/HakiosAudio.discovery tools/lapis_audio_hal/audio_plugin.c
          codesign -s - -f out/HakiosAudio.discovery
          gzip -n -c out/HakiosAudio.discovery > out/hal_probe.gz
          xxd -i -n lapis_hal_gz out/hal_probe.gz > out/hal_probe_gz.h
          xxd -i -n lapis_hal_plist tools/lapis_audio_hal/audio_plugin.plist > out/hal_probe_plist.h
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O2 -Wall -Wextra -Iout -lz -o out/lapis_hal_discovery_check tools/lapis_audio_probe/hal_discovery_check.c
          strip -x out/lapis_hal_discovery_check
          codesign -s - -f out/lapis_hal_discovery_check
          test "$(stat -f %z out/lapis_hal_discovery_check)" -le 147456
          xxd -i -n lapis_hal_gz tools/lapis_audio_probe/discovery-v1.gz > out/hal_probe_gz.h
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O2 -Wall -Wextra -DLAPIS_HAL_CLEANUP_ONLY -DLAPIS_HAL_CLEAN_DELAY=0 -Iout -lz -o out/lapis_hal_cleanup_check tools/lapis_audio_probe/hal_discovery_check.c
          strip -x out/lapis_hal_cleanup_check
          codesign -s - -f out/lapis_hal_cleanup_check
          test "$(stat -f %z out/lapis_hal_cleanup_check)" -le 147456
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O2 -Wall -bundle -DLAPIS_HAL_DISCOVERY_PROBE -DLAPIS_HAL_ROUTE_PROBE -framework CoreFoundation -o out/HakiosAudio.route tools/lapis_audio_hal/audio_plugin.c
          codesign -s - -f out/HakiosAudio.route
          gzip -n -c out/HakiosAudio.route > out/hal_probe.gz
          xxd -i -n lapis_hal_gz out/hal_probe.gz > out/hal_probe_gz.h
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O2 -Wall -Wextra -DLAPIS_HAL_REPORT_IOCTL -Iout -lz -o out/lapis_hal_route_check tools/lapis_audio_probe/hal_discovery_check.c
          strip -x out/lapis_hal_route_check
          codesign -s - -f out/lapis_hal_route_check
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O2 -Wall -Wextra -DLAPIS_HAL_CLEANUP_ONLY -DLAPIS_HAL_CLEAN_DELAY=0 -Iout -lz -o out/lapis_hal_route_cleanup tools/lapis_audio_probe/hal_discovery_check.c
          strip -x out/lapis_hal_route_cleanup
          codesign -s - -f out/lapis_hal_route_cleanup
          test "$(stat -f %z out/lapis_hal_route_check)" -le 147456
          test "$(stat -f %z out/lapis_hal_route_cleanup)" -le 147456
          rm out/hal_probe.gz out/hal_probe_gz.h out/hal_probe_plist.h
          shasum -a 256 out/lapis_audio_probe out/lapis_hal_check out/lapis_hal_driver_check out/lapis_hal_sound_check out/lapis_hal_cycle_check out/lapis_hal_fs_check out/HakiosAudio.discovery out/lapis_hal_discovery_check out/lapis_hal_cleanup_check out/HakiosAudio.route out/lapis_hal_route_check out/lapis_hal_route_cleanup | tee out/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lapis-audio-probe
          path: out/

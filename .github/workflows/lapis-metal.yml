name: lapis-metal

# The LapisMetal plug-in (tools/lapis_metal/LapisMetal.m: Metal's device on
# the lapis phone, over Apple's AGXMetalA11.bundle) and its test program
# (lapis_metaltest.m), for the phone's iOS: arm64, ad-hoc signed.
# device/lapis_metal_plan.md, milestones 2-4.

on:
  workflow_dispatch:
  push:
    paths:
      - tools/lapis_metal/**
      - .github/workflows/lapis-metal.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS arm64
        env:
          # -DLAPIS_BACKBOARDD_OFF keeps backboardd off the GPU (m7q's big-memory test)
          LAPIS_METAL_DEFINES: ""
        run: |
          set -euxo pipefail
          mkdir -p out
          FLAGS="-arch arm64 -miphoneos-version-min=16.0 -O2 -fobjc-arc -Wall"
          # the test kernels: Apple's AIR in a .metallib, embedded in the test program
          xcrun --sdk iphoneos metal --version || xcodebuild -downloadComponent MetalToolchain
          xcrun --sdk iphoneos metal -std=ios-metal2.4 -mios-version-min=16.0 -Os \
            -o out/lapis_test.metallib tools/lapis_metal/lapis_test.metal
          (cd out && xxd -i lapis_test.metallib > lapis_test_metallib.h)
          xcrun --sdk iphoneos clang $FLAGS -dynamiclib -install_name /System/Library/Extensions/AGXMetalA11.bundle/ds.g10p \
            ${LAPIS_METAL_DEFINES:-} -o out/LapisMetal.dylib tools/lapis_metal/LapisMetal.m \
            -framework Foundation -framework Metal -framework IOKit -framework CoreFoundation -framework IOSurface
          # the test program goes into a 147456-byte slot (tools/lapis_rootslot.sh fdr): small and stripped
          xcrun --sdk iphoneos clang $FLAGS -Os -o out/lapis_metaltest tools/lapis_metal/lapis_metaltest.m -Iout \
            -framework Foundation -framework Metal -framework IOKit -framework CoreFoundation -framework IOSurface
          strip -x out/lapis_metaltest
          rm out/lapis_test_metallib.h
          for f in out/LapisMetal.dylib out/lapis_metaltest; do codesign -s - -f "$f"; done
          test $(stat -f %z out/lapis_metaltest) -le 147456 || { echo "lapis_metaltest is past the fdr slot (signed)"; exit 1; }
          ls -la out
          otool -L out/LapisMetal.dylib out/lapis_metaltest
          shasum -a 256 out/* | tee out/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lapis-metal
          path: out/

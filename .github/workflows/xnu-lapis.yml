name: lapis-xnu

# Builds the SWEET-config XNU (ios-sweet 0001-0079 via the pinned ios-topaz
# commit) plus the LAPIS patch queue. The upstream trees have no license file,
# so they are fetched at build time and never committed here
# (device/xnu-lapis/ci/prepare_baseline.py). The output is a compile artifact
# only: it is NOT a phone-bootable lapis image.

on:
  workflow_dispatch:
    inputs:
      kernel_config:
        description: XNU configuration
        type: choice
        options: [DEVELOPMENT, DEBUG, RELEASE]
        default: DEVELOPMENT

permissions:
  contents: read

concurrency:
  group: lapis-xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: "13.5"
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  # The whole ios-sweet series and its stage scripts are gated on SWEET;
  # lapis differences come from the ADT (tools/lapis_mkadt.py) and boot-args.
  MACHINE_CONFIG: SWEET

jobs:
  build:
    # macos-14 (the last image with Xcode 15.x) was retired on 2026-11-02.
    # macos-15 carries Xcode 16.x/26.x only; ruby-ios-bringup builds the same
    # sweet 0001-0079 series there with Xcode 16.0, source unchanged. Later
    # Xcode 16 iig versions emit the IORPC "kernelContent" member xnu-8796
    # lacks, so the Xcode is pinned exactly and the job fails instead of drifting.
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Assemble LAPIS patch queue
        run: python3 device/xnu-lapis/ci/prepare_baseline.py queue | tee queue.txt

      - name: Fetch pinned XNU build harness
        shell: bash
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          cp queue/*.patch queue/*.sh dxb/patches/
          # plain arm64 for Cortex-A55; clang's default would emit LSE/LDAPR
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="arm64" VALID_ARCHS="arm64" OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed -mcpu=cortex-a55"/' dxb/build.sh
          grep -q 'OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed -mcpu=cortex-a55"' dxb/build.sh

      - name: Install build tools and select Xcode 16.0
        shell: bash
        run: |
          brew install jq gum bash cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          ls -d /Applications/Xcode*.app
          XC=""
          for cand in /Applications/Xcode_16.0.app /Applications/Xcode_16.0.0.app; do
            [ -d "$cand" ] && { XC="$cand"; break; }
          done
          [ -n "$XC" ] || { echo "Xcode 16.0 missing on this image; refusing to drift"; exit 1; }
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build XNU
        working-directory: dxb
        shell: bash
        env:
          # bearssl.org intermittently returns 502; this mirror carries the same
          # pinned commit, which 0020-stage-bearssl.sh verifies by SHA.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://github.com/status-im/BearSSL.insteadOf
          GIT_CONFIG_VALUE_0: https://www.bearssl.org/git/BearSSL
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee ../build.log

      - name: Fail on silently skipped patches
        if: always()
        shell: bash
        run: |
          # darwin-xnu-build only warns when a patch does not apply. Its own
          # version-specific patches (Monterey/Sonoma/TrustCache) are expected
          # to skip on 13.5; every patch of our queue must be applied.
          missing=0
          for p in queue/*.patch; do
            name=$(basename "$p")
            if ! grep -q "Applying patch: .*/$name\$" build.log; then
              echo "::error::queue patch not applied: $name"
              missing=1
            fi
          done
          grep -n "Skipping patch" build.log || true
          [ "$missing" = 0 ] && echo "all $(ls queue/*.patch | wc -l | tr -d ' ') queue patches applied"
          exit $missing

      - name: Collect build output and status
        if: always()
        shell: bash
        run: |
          mkdir -p out
          cp build.log out/ 2>/dev/null || true
          kernel_dir=dxb/fakeroot/System/Library/Kernels
          if compgen -G "$kernel_dir/kernel.*" >/dev/null; then
            cp -R "$kernel_dir"/kernel.* out/
            (cd out && find . -maxdepth 1 -type f -name 'kernel.*' -exec shasum -a 256 {} + > SHA256SUMS)
            echo "Kernel produced. Compile artifact only: lapis has no XNU boot shim/loader yet and the kernel has not run on the phone. Do not flash it." > out/BUILD_STATUS.txt
          else
            echo "No kernel produced; see build.log for the first fatal error." > out/BUILD_STATUS.txt
          fi
          { cat queue.txt 2>/dev/null; echo "dxb_sha=$DXB_SHA"; echo "commit=$GITHUB_SHA"; echo "run_id=$GITHUB_RUN_ID";
            echo "patches=$(ls queue/*.patch | wc -l | tr -d ' ')"; } > out/PROVENANCE.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lapis-xnu-${{ inputs.kernel_config || 'DEVELOPMENT' }}
          path: out/
          if-no-files-found: warn
          retention-days: 7
